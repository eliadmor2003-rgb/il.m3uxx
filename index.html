<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אימות אבטחה</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f9f9f9; margin: 0; overflow: hidden; }
        
        /* שלב 1: אני לא רובוט */
        .robot-check { background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 3px; width: 300px; height: 74px; display: flex; align-items: center; padding: 0 12px; box-shadow: 0 0 4px rgba(0,0,0,0.1); cursor: pointer; }
        .checkbox { width: 24px; height: 24px; border: 2px solid #c1c1c1; border-radius: 2px; margin-left: 12px; position: relative; background: white; }
        .checkbox.checked::after { content: '✓'; position: absolute; top: -5px; left: 2px; font-size: 22px; color: #009a44; }
        .robot-text { flex-grow: 1; font-size: 14px; color: #555; }

        /* שלב 2: תיבת התמונות */
        .captcha-box { display: none; background: white; padding: 15px; border: 1px solid #ccc; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 360px; z-index: 100; position: absolute; }
        .header { background: #4285f4; color: white; margin: -15px -15px 15px -15px; padding: 20px; }
        .header p { margin: 0; font-size: 20px; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 15px; }
        
        /* עיצוב התמונה והלב */
        .img-wrapper { position: relative; width: 100%; height: 110px; cursor: pointer; overflow: hidden; }
        .grid img { width: 100%; height: 100%; object-fit: cover; transition: 0.2s; }
        
        .heart-icon { 
            position: absolute; bottom: 5px; left: 5px; 
            font-size: 20px; color: #ff4d6d; 
            display: none; /* מוסתר כברירת מחדל */
            filter: drop-shadow(0 0 2px white);
        }
        
        /* כשנבחר: הלב מופיע והתמונה קצת קטנה */
        .img-wrapper.selected .heart-icon { display: block; }
        .img-wrapper.selected img { transform: scale(0.92); opacity: 0.9; }

        .footer { border-top: 1px solid #eee; padding-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #4285f4; color: white; border: none; padding: 10px 24px; cursor: pointer; font-weight: bold; border-radius: 3px; }
        .error-msg { color: #d93025; font-size: 13px; display: none; margin-bottom: 10px; font-weight: bold; }

        /* שלב 3: הצלחה */
        #success-page { display: none; text-align: center; }
        #success-page h1 { color: #d63384; font-size: 3rem; }
        .falling-heart { position: absolute; top: -10%; color: #ff4d6d; font-size: 20px; pointer-events: none; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="first-step" class="robot-check" onclick="showCaptcha()">
        <div id="main-checkbox" class="checkbox"></div>
        <div class="robot-text">אני לא רובוט</div>
        <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" width="30">
    </div>

    <div id="captcha-container" class="captcha-box">
        <div class="header">
            <p>תלחצי על תמונות שאת אוהבת</p>
        </div>
        <div id="error" class="error-msg">בבקשה תבחרי את כל התמונות שאת אוהבת...</div>
        <div class="grid" id="imageGrid"></div>
        <div class="footer">
            <button class="btn" onclick="checkCaptcha()">אישור</button>
        </div>
    </div>

    <div id="success-page">
        <h1>בוקר טוב, אני אוהב אותך ❤️</h1>
        <p style="font-size: 1.5rem;">שיהיה לך יום מדהים!</p>
    </div>

    <script>
        // וודא שהתמונות בגיטהאב הן .png
        const images = [
            { src: 'other5.png', correct: false }
        ];

        function showCaptcha() {
            document.getElementById('main-checkbox').classList.add('checked');
            setTimeout(() => {
                document.getElementById('first-step').style.display = 'none';
                document.getElementById('captcha-container').style.display = 'block';
                renderGrid();
            }, 600);
        }

        function renderGrid() {
            const grid = document.getElementById('imageGrid');
            images.forEach(imgData => {
                const wrapper = document.createElement('div');
                wrapper.classList.add('img-wrapper');
                
                const img = document.createElement('img');
                img.src = imgData.src;
                
                const heart = document.createElement('div');
                heart.classList.add('heart-icon');
                heart.innerHTML = '❤️';
                
                wrapper.dataset.correct = imgData.correct;
                wrapper.onclick = () => wrapper.classList.toggle('selected');
                
                wrapper.appendChild(img);
                wrapper.appendChild(heart);
                grid.appendChild(wrapper);
            });
        }

        function checkCaptcha() {
            const wrappers = document.querySelectorAll('.img-wrapper');
            let isCorrect = true;
            let selectedCount = 0;

            wrappers.forEach(w => {
                const isSelected = w.classList.contains('selected');
                const shouldBeSelected = w.dataset.correct === "true";
                if (isSelected) selectedCount++;
                if (isSelected !== shouldBeSelected) isCorrect = false;
            });

            if (isCorrect && selectedCount > 0) {
                document.getElementById('captcha-container').style.display = 'none';
                document.getElementById('success-page').style.display = 'block';
                document.body.style.backgroundColor = "#fff0f5";
                for (let i = 0; i < 50; i++) setTimeout(createHeart, i * 150);
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
